name: Verify Hetzner SSH host key
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and verify SSH server fingerprint
        run: |
          set -eu
          ssh-keyscan -T 15 -p 22 -t ed25519 www35.your-server.de > hostkey.txt
          test -s hostkey.txt
          ssh-keygen -lf hostkey.txt -E sha256
          fingerprint=$(ssh-keygen -lf hostkey.txt -E sha256 | awk '{print $2}')
          test "$fingerprint" = "SHA256:xhMd3PNSYd8mVB6yDCUsNN6maH9YyXhAAy2PQGL9cts"
          echo "SSH host fingerprint matches the previously trusted Termius fingerprint."
