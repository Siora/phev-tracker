name: Deploy PWA to Hetzner

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'i18n/**'
      - 'app.js'
      - 'intelligent-analytics.js'
      - 'pagination.js'
      - 'pdf-report.js'
      - 'csv-import-utils.js'
      - 'auto-backup.js'
      - 'vehicle-costs.js'
      - 'receipt-ocr.js'
      - 'receipt-parser.js'
      - 'receipt-preview.js'
      - 'cloud.js'
      - 'charts.js'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'tests/refactoring.test.cjs'
      - 'server/api.php'
  workflow_dispatch:
    inputs:
      upload:
        description: "PWA-Dateien wirklich hochladen? (false = nur Verbindung testen)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: hetzner-pwa-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PWA
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Release-Version und Offline-Cache abgleichen
        run: node scripts/release-version.cjs --check

      - name: Run offline refactoring regression tests
        shell: bash
        run: node --test tests/refactoring.test.cjs

      - name: Validate PHP API syntax
        shell: bash
        run: php -l server/api.php

      - name: Verify server identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p 22 -t ed25519 www35.your-server.de > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          fingerprint="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')"
          test "$fingerprint" = "SHA256:xhMd3PNSYd8mVB6yDCUsNN6maH9YyXhAAy2PQGL9cts" || { echo "Host fingerprint mismatch"; exit 1; }
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare private deployment key
        env:
          DEPLOY_KEY: ${{ secrets.HETZNER_SFTP_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Check destination (no upload)
        env:
          SFTP_HOST: ${{ vars.HETZNER_SFTP_HOST }}
          SFTP_USER: ${{ vars.HETZNER_SFTP_USER }}
          SFTP_DIR: ${{ vars.HETZNER_PWA_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SFTP_HOST" = "www35.your-server.de"
          test -n "$SFTP_USER"
          test "$SFTP_DIR" = "public_html/phev-tracker"
          printf 'cd "%s"\npwd\nls -la\n' "$SFTP_DIR" > /tmp/check.batch
          sftp -oBatchMode=yes -oStrictHostKeyChecking=yes -oIdentityFile="$HOME/.ssh/deploy_key" -P 22 -b /tmp/check.batch "$SFTP_USER@$SFTP_HOST"

      # Die produktiven Cookie-/Foto-/iOS-Funktionen wurden mit dem vom
      # Benutzer bereitgestellten Serverstand abgeglichen.
      - name: Upload PHP API with rollback
        if: ${{ github.event_name == 'push' || inputs.upload == true }}
        env:
          SFTP_HOST: ${{ vars.HETZNER_SFTP_HOST }}
          SFTP_USER: ${{ vars.HETZNER_SFTP_USER }}
          SFTP_DIR: ${{ vars.HETZNER_PWA_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SFTP_HOST" = "www35.your-server.de"
          test "$SFTP_DIR" = "public_html/phev-tracker"
          test -s server/api.php
          # Save the current production API privately on the runner before
          # replacing it. No backup or config file is written into webroot.
          printf 'cd "%s/api"\nget "api.php" "/tmp/phev-api-previous.php"\n' "$SFTP_DIR" > /tmp/check-api.batch
          sftp -oBatchMode=yes -oStrictHostKeyChecking=yes -oIdentityFile="$HOME/.ssh/deploy_key" -P 22 -b /tmp/check-api.batch "$SFTP_USER@$SFTP_HOST"
          test -s /tmp/phev-api-previous.php
          printf 'cd "%s/api"\nput "server/api.php" "api.php"\n' "$SFTP_DIR" > /tmp/upload-api.batch
          sftp -oBatchMode=yes -oStrictHostKeyChecking=yes -oIdentityFile="$HOME/.ssh/deploy_key" -P 22 -b /tmp/upload-api.batch "$SFTP_USER@$SFTP_HOST"
          # An unauthenticated request must receive 401. This also detects
          # PHP fatal errors, missing config and unavailable database.
          code="$(curl --silent --show-error --output /tmp/api-health.json --write-out '%{http_code}' 'https://tracker.web-produktion.com/api/api.php?action=session')"
          if [ "$code" != "401" ]; then
            echo "API health check failed (HTTP $code); restoring previous version."
            printf 'cd "%s/api"\nput "/tmp/phev-api-previous.php" "api.php"\n' "$SFTP_DIR" > /tmp/restore-api.batch
            sftp -oBatchMode=yes -oStrictHostKeyChecking=yes -oIdentityFile="$HOME/.ssh/deploy_key" -P 22 -b /tmp/restore-api.batch "$SFTP_USER@$SFTP_HOST"
            exit 1
          fi
          echo "PHP API deployed and unauthenticated health check passed."

      - name: Prepare local jsPDF asset
        if: ${{ github.event_name == 'push' || inputs.upload == true }}
        shell: bash
        run: |
          set -euo pipefail
          # Use the npm package as the primary source; avoid a single CDN dependency.
          npm pack jspdf@2.5.2 --pack-destination /tmp
          tar -xzf /tmp/jspdf-2.5.2.tgz -C /tmp package/dist/jspdf.umd.min.js
          cp /tmp/package/dist/jspdf.umd.min.js ./jspdf.umd.min.js
          test "$(wc -c < jspdf.umd.min.js)" -gt 100000

      - name: Prepare self-hosted OCR assets
        if: ${{ github.event_name == 'push' || inputs.upload == true }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phev-ocr/js /tmp/phev-ocr/core
          npm pack tesseract.js@5.1.1 --pack-destination /tmp/phev-ocr/js
          npm pack tesseract.js-core@5.1.1 --pack-destination /tmp/phev-ocr/core
          tar -xzf /tmp/phev-ocr/js/tesseract.js-5.1.1.tgz -C /tmp/phev-ocr/js
          tar -xzf /tmp/phev-ocr/core/tesseract.js-core-5.1.1.tgz -C /tmp/phev-ocr/core
          cp /tmp/phev-ocr/js/package/dist/tesseract.min.js ./tesseract.min.js
          cp /tmp/phev-ocr/js/package/dist/worker.min.js ./tesseract-worker.min.js
          cp /tmp/phev-ocr/core/package/tesseract-core*.wasm* .
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/deu.traineddata -o /tmp/phev-deu.traineddata
          gzip -n -c /tmp/phev-deu.traineddata > ./deu.traineddata.gz
          test -s tesseract.min.js
          test -s tesseract-worker.min.js
          test -s deu.traineddata.gz
          test -s tesseract-core-simd-lstm.wasm.js

      - name: Upload only PWA files (never api/)
        if: ${{ github.event_name == 'push' || inputs.upload == true }}
        env:
          SFTP_HOST: ${{ vars.HETZNER_SFTP_HOST }}
          SFTP_USER: ${{ vars.HETZNER_SFTP_USER }}
          SFTP_DIR: ${{ vars.HETZNER_PWA_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html app.js intelligent-analytics.js cloud.js charts.js pagination.js pdf-report.js csv-import-utils.js auto-backup.js vehicle-costs.js receipt-parser.js receipt-preview.js receipt-ocr.js i18n/de.js i18n/en.js i18n/core.js tesseract.min.js tesseract-worker.min.js tesseract-core*.wasm* deu.traineddata.gz styles.css sw.js manifest.webmanifest jspdf.umd.min.js; do
            test -f "$file"
          done
          {
            printf 'cd "%s"\n' "$SFTP_DIR"
            printf -- '-mkdir i18n\\n'
            for file in index.html app.js intelligent-analytics.js cloud.js charts.js pagination.js pdf-report.js csv-import-utils.js auto-backup.js vehicle-costs.js receipt-parser.js receipt-preview.js receipt-ocr.js tesseract.min.js tesseract-worker.min.js tesseract-core*.wasm* deu.traineddata.gz styles.css sw.js manifest.webmanifest jspdf.umd.min.js; do
              printf 'put "%s"\n' "$file"
            done
          } > /tmp/upload.batch
          sftp -oBatchMode=yes -oStrictHostKeyChecking=yes -oIdentityFile="$HOME/.ssh/deploy_key" -P 22 -b /tmp/upload.batch "$SFTP_USER@$SFTP_HOST"

